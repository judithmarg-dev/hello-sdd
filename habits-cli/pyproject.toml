[project]
name = "habits-cli"
version = "0.1.0"
description = "CLI para registrar hábitos diarios y rastrear rachas consecutivas"
requires-python = ">=3.12"
authors = [{name = "Judith Paco", email = "Judith.Paco@jalasoft.com"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
habits = "habits.__main__:main"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
